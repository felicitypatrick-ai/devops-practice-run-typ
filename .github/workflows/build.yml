name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that app/order_total.py compiles
        run: python -m py_compile app/order_total.py

      - name: Copy .py files into dist
        run: |
          mkdir -p dist
          cp app/*.py dist/

      - name: Write commit ID to BUILD_INFO.txt
        run: echo "${{ github.sha }}" > dist/BUILD_INFO.txt

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakery-app
          path: dist
